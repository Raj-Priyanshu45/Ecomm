# ================================================================
# application-prod.properties — Railway deployment
# ================================================================
# NOTE: DB credentials, Keycloak, mail & Cloudinary are injected
# automatically by Railway via SPRING_DATASOURCE_URL, etc.
# No need to redeclare them here.
# ================================================================

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Async
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100

# Logging
logging.level.com.ecommerce=INFO
logging.level.org.springframework.security=WARN

server.port=8080

# Flyway
# baseline-on-migrate is intentionally REMOVED.
# With it set to true, Flyway baselines at V1 and SKIPS V1__init.sql,
# so on a fresh Railway DB none of the tables (orders, products, etc.)
# ever get created. Without it, Flyway runs all migrations from V1.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.repair-on-migrate=true

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true